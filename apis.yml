aid: glowforge
name: Glowforge
description: 'Glowforge is a Seattle-based consumer hardware company that makes desktop
  3D laser printers (Glowforge Pro, Plus, Aura, and Spark) which cut and engrave materials
  such as wood, acrylic, leather, fabric, and paper. The machines are cloud-connected:
  designs are prepared in the browser-based Glowforge App (app.glowforge.com) and sent
  to the printer over the internet, with camera-based material placement, autofocus,
  and an online design catalog and marketplace. Glowforge does not publish a public
  developer API; its developer-facing footprint is limited to open-source GPL firmware
  and kernel components on GitHub (published for license compliance) and a public
  system status page.'
